<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>MathHero - Premium Malaysia Learning Portal</title>
    <style>
        :root {
            --bg-primary: #070612;
            --surface: #121124;
            --accent-glow: #00ffcc;
            --text-main: #ffffff;
            --text-dim: #8b8da3;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.05);
        }
        h1, h2 {
            color: var(--accent-glow);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .setup-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            color: var(--text-dim);
            font-weight: bold;
        }
        select, input {
            background: #1c1a36;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        select:focus, input:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
        }
        .btn {
            background: linear-gradient(135deg, #00ffcc, #00b3ff);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4);
        }
        .game-canvas-area {
            margin-top: 30px;
            background: #0a0918;
            border-radius: 12px;
            padding: 25px;
            min-height: 300px;
            border: 1px dashed rgba(255,255,255,0.1);
            position: relative;
        }
        .metric-badge {
            display: inline-block;
            background: rgba(0, 255, 204, 0.1);
            color: var(--accent-glow);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .hidden { display: none; }
        .feedback { font-weight: bold; margin-top: 15px; font-size: 18px; }
        .success { color: #00ff66; }
        .error { color: #ff3366; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 MathHero Universal Gamified Engine</h1>
    
    <div id="account-status-bar" style="text-align: right; margin-bottom: 20px;">
        <span class="metric-badge" id="tier-display">Tier Status: Free Trial (3 Days Left)</span>
    </div>

    <div class="setup-grid">
        <div class="control-group">
            <label for="track-select">Choose School Track / Syllabus</label>
            <select id="track-select" onchange="syncSyllabusDropdowns()">
                <option value="sk">SK National Track (Malay / KSSR)</option>
                <option value="sjkc">SJKC Vernacular Track (Mandarin / 华小)</option>
                <option value="igcse">IGCSE International Track (English / Cambridge)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="year-select">Choose Academic Level / Year</label>
            <select id="year-select" onchange="syncSyllabusDropdowns()">
            </select>
        </div>

        <div class="control-group">
            <label for="chapter-select">Choose Core Textbook Chapter</label>
            <select id="chapter-select">
            </select>
        </div>
    </div>

    <button class="btn" onclick="launchGamifiedModule()">Enter Gaming Arena</button>

    <div class="game-canvas-area">
        <div id="game-lobby-message">
            <h3 style="text-align:center; color: var(--text-dim); margin-top: 100px;">Configure your parameters above to initialize the module.</h3>
        </div>
        
        <div id="active-arena" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="metric-badge" id="game-title-display">Quest Loaded</span>
                <div>
                    <span style="color: gold; font-weight: bold; margin-right: 15px;">🪙 Coins: <span id="coin-counter">0</span></span>
                    <span style="color: #00ffcc; font-weight: bold;">⭐ XP: <span id="xp-counter">0</span></span>
                </div>
            </div>
            
            <div id="gameplay-viewport" style="background: #111026; padding: 20px; border-radius: 8px; margin: 20px 0; border: 1px solid rgba(255,255,255,0.05);">
            </div>
            
            <div class="control-group" id="input-container">
            </div>
            <button class="btn" style="margin-top:15px;" onclick="evaluateUserAction()">Submit Action</button>
            <div id="arena-feedback" class="feedback"></div>
        </div>
    </div>
    
    <div id="paywall-gate" class="hidden" style="margin-top: 30px; padding: 25px; background: rgba(255, 51, 102, 0.1); border-radius: 12px; border: 1px solid #ff3366; text-align: center;">
        <h3 style="color: #ff3366; margin-top: 0;">🔒 PREMIUM MILESTONE LOCKED</h3>
        <p>Your 3-day free trial limit has been reached. Subscribe to premium for RM 35 monthly renewal.</p>
        <button class="btn" style="background: linear-gradient(135deg, #ff3366, #ff0055); color: white;" onclick="triggerSubscriptionPurchase()">Unlock All Modules Now</button>
    </div>
</div>

<script>
const syllabusDatabase = {
    sk: {
        years: ["Darjah 1", "Darjah 2", "Darjah 3", "Darjah 4", "Darjah 5", "Darjah 6"],
        chapters: {
            "Darjah 1": [
                {id:"SK_Y1_C1", title:"C1: Nombor Bulat hingga 100", game:"Misi Pulau Angka", problem:"Susun nombor berikut mengikut tertib menaik: 14, 8, 29, 21.", answer:"8,14,21,29", type:"game"},
                {id:"SK_Y1_P1", title:"[EXAM] Kertas Model UASA Pertengahan Tahun", problem:"Selesaikan: Syafiq ada 12 guli. Danial memberi 7 guli lagi. Berapakah jumlah guli Syafiq?", answer:"19", type:"exam"}
            ],
            "Darjah 6": [
                {id:"SK_Y6_C3", title:"C3: Wang & Pengurusan Cukai", game:"Simulasi Cukai Pendapatan", problem:"Hitung cukai perkhidmatan 6% bagi bil makanan bernilai RM150.", answer:"9", type:"game"}
            ]
        }
    },
    sjkc: {
        years: ["一年级 (Standard 1)", "二年级 (Standard 2)", "三年级 (Standard 3)", "四年级 (Standard 4)", "五年级 (Standard 5)", "六年级 (Standard 6)"],
        chapters: {
            "一年级 (Standard 1)": [
                {id:"SJKC_Y1_C1", title:"C1: 100以内的整数", game:"火箭密码倒数", problem:"写出数字45的十位近似值。", answer:"50", type:"game"}
            ]
        }
    },
    igcse: {
        years: ["Year 1 (Age 5-6)", "Year 2 (Age 6-7)", "Year 3 (Age 7-8)", "Year 4 (Age 8-9)", "Year 5 (Age 9-10)", "Year 6 (Age 10-11)"],
        chapters: {
            "Year 6 (Age 10-11)": [
                {id:"IG_Y6_C2", title:"C2: Order of Operations (BODMAS)", game:"Nuclear Core Calibration", problem:"Evaluate the expression: 12 + 4 x (15 - 9) / 2", answer:"24", type:"game"}
            ]
        }
    }
};

let currentTrack = 'sk';
let currentYear = '';
let currentActiveModule = null;
let currentStudentScoreTracker = { baseline: 45, current: 45, itemsAnswered: 0 };
let userWallet = { xp: 120, coins: 40 };
let isSubscribedUser = false;

function syncSyllabusDropdowns() {
    currentTrack = document.getElementById('track-select').value;
    const yearSelect = document.getElementById('year-select');
    const chapterSelect = document.getElementById('chapter-select');
    const trackData = syllabusDatabase[currentTrack];
    
    const savedYearIdx = yearSelect.selectedIndex >= 0 ? yearSelect.selectedIndex : 0;
    yearSelect.innerHTML = "";
    trackData.years.forEach(y => {
        let opt = document.createElement('option');
        opt.value = y; opt.innerText = y;
        yearSelect.appendChild(opt);
    });
    
    yearSelect.selectedIndex = savedYearIdx < yearSelect.options.length ? savedYearIdx : 0;
    currentYear = yearSelect.value;
    
    chapterSelect.innerHTML = "";
    const displayChapters = trackData.chapters[currentYear] || [
        {id:"placeholder", title:"Semua Sub-topik Buku Teks Terkini Lengkap", problem:"Selesaikan asas matematik.", answer:"0", type:"game"}
    ];
    
    displayChapters.forEach(ch => {
        let opt = document.createElement('option');
        opt.value = ch.id; opt.innerText = ch.title;
        chapterSelect.appendChild(opt);
    });
}

function launchGamifiedModule() {
    document.getElementById('game-lobby-message').classList.add('hidden');
    document.getElementById('active-arena').classList.remove('hidden');
    
    const targetId = document.getElementById('chapter-select').value;
    const trackChapters = syllabusDatabase[currentTrack].chapters[currentYear] || [];
    currentActiveModule = trackChapters.find(c => c.id === targetId) || {
